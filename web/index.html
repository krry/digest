<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Digest</title>
    <meta name="theme-color" content="#080c18">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
  </head>
  <body>
    <div id="depth-bg"></div>
    <div id="app">

      <nav id="breadcrumbs" class="breadcrumbs">
        <button id="sync-button" class="sync-button" aria-label="Sync">&#x21BB;</button>
        <span id="sync-dot" class="sync-dot"></span>
      </nav>

      <main>
        <section id="focus-card" class="focus-card hidden"></section>
        <section id="list" class="list"></section>
        <section id="empty-state" class="empty-state hidden">
          <p>Nothing here yet.</p>
        </section>
      </main>

      <div class="sort-strip">
        <select id="sort-select">
          <option value="manual">Manual</option>
          <option value="title">Title</option>
          <option value="created">Created</option>
          <option value="status">Status</option>
          <option value="importance">Importance</option>
          <option value="due">Due</option>
        </select>
        <div class="composer-mode-toggle">
          <button id="children-view-button" type="button" class="mode-btn active">Children</button>
          <button id="all-view-button" type="button" class="mode-btn">All</button>
        </div>
        <button id="nav-values" class="footer-values-btn">Values</button>
      </div>

      <form id="composer" class="composer composer--collapsed">
        <button id="composer-fab" type="button" class="composer-fab" aria-label="Add node">+</button>
        <div class="composer-body">
          <input id="composer-input" type="text" placeholder="What belongs here?" autocomplete="off">
          <div class="composer-actions">
            <button type="submit" class="primary-button">Add</button>
            <div id="composer-mode-toggle" class="composer-mode-toggle">
              <button type="button" class="mode-btn active" data-mode="child">Child</button>
              <button type="button" class="mode-btn" data-mode="sibling">Sibling</button>
            </div>
          </div>
        </div>
      </form>
    </div>

    <!-- Values overlay page -->
    <div id="values-page" class="values-page hidden">
      <div class="values-page-header glass-panel">
        <button id="values-back" class="icon-button">&#x2190;</button>
        <h2 class="values-page-title">Values</h2>
        <span id="values-count" class="muted"></span>
      </div>
      <div id="values-list" class="values-list"></div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
