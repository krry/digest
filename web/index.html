<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Digest</title>
    <meta name="theme-color" content="#080c18">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
  </head>
  <body>
    <div id="depth-bg"></div>
    <div id="app">

      <nav id="breadcrumbs" class="breadcrumbs"></nav>

      <main>
        <section id="focus-card" class="focus-card hidden"></section>
        <section id="list" class="list"></section>
        <section id="empty-state" class="empty-state hidden">
          <p>Nothing here yet.</p>
        </section>
      </main>

      <div class="sort-strip">
        <select id="sort-select">
          <option value="manual">Manual</option>
          <option value="title">Title</option>
          <option value="created">Created</option>
          <option value="status">Status</option>
          <option value="importance">Importance</option>
          <option value="due">Due</option>
        </select>
        <div class="composer-mode-toggle">
          <button id="children-view-button" type="button" class="mode-btn active">Children</button>
          <button id="all-view-button" type="button" class="mode-btn">All</button>
        </div>
        <button id="nav-values" class="footer-values-btn">Values</button>
      </div>

      <form id="composer" class="composer">
        <input id="composer-input" type="text" placeholder="What belongs here?" autocomplete="off">
        <button type="submit" class="composer-submit" aria-label="Add">+</button>
      </form>
    </div>

    <!-- Values overlay page -->
    <div id="values-page" class="values-page hidden">
      <div class="values-page-header glass-panel">
        <button id="values-back" class="icon-button">&#x2190;</button>
        <h2 class="values-page-title">Values</h2>
        <span id="values-count" class="muted"></span>
      </div>
      <div id="values-list" class="values-list"></div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
